# Installers: PixelOffice-<ver>-Windows.exe, PixelOffice-<ver>-Mac.pkg (universal: Apple silicon + Intel),
# plus PixelOffice-<ver>-node-<node>-app.tgz (+ .sha256): dist/ for the silent in-app update.
# workflow_dispatch → build and upload as run artifacts only.
# push tag v<ver>    → also publish a GitHub Release (prerelease when the tag has a "-").

name: Package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build dist/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - id: version
        name: Version (tag must equal v<package.json version>)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME != v$VERSION (package.json)"
            exit 1
          fi
      - run: npm ci
      - run: npm run package
      - id: app
        name: App bundle for silent updates (dist/ + app.json, plain ustar)
        run: |
          NODE=$(tr -d '[:space:]' < scripts/package/node-version.txt)
          NAME="PixelOffice-$VERSION-node-$NODE-app.tgz"
          node -e "require('fs').writeFileSync('dist/app.json', JSON.stringify({version: process.argv[1], node: process.argv[2]}))" "$VERSION" "$NODE"
          mkdir -p appbundle
          tar --format=ustar --owner=0 --group=0 --numeric-owner --exclude='*.map' -czf "appbundle/$NAME" -C dist .
          (cd appbundle && sha256sum "$NAME" > "$NAME.sha256" && cat "$NAME.sha256")
          tar -tzvf "appbundle/$NAME" | awk '{print $1}' | sort | uniq -c   # only - and d entries
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.app.outputs.name }}
          path: appbundle/
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Stage node.exe + app
        shell: pwsh
        run: |
          node scripts/package/fetch-node.mjs win-x64 build/win
          Copy-Item scripts/package/launch.vbs build/win/
          node scripts/package/png2ico.mjs icon.png build/win/icon.ico
          Copy-Item LICENSE build/win/LICENSE.txt
          Copy-Item -Recurse dist build/win/app
          Get-ChildItem build/win/app -Recurse -Filter *.map | Remove-Item
      - name: Build tray helper (PixelOfficeTray.exe, csc.exe that ships with Windows)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe missing: $csc" }
          & $csc /nologo /target:winexe /optimize+ /win32icon:build\win\icon.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /out:build\win\PixelOfficeTray.exe scripts\package\tray\PixelOfficeTray.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $v = (Get-Item build/win/PixelOfficeTray.exe).VersionInfo
          "FileDescription=$($v.FileDescription) ProductName=$($v.ProductName)"
          if ($v.FileDescription -ne 'Pixel Office') { throw 'FileDescription must be Pixel Office (notification name)' }
          $out = & build/win/PixelOfficeTray.exe --smoke | Out-String
          $out
          if ($out -notmatch '(?m)^ready') { throw 'PixelOfficeTray.exe --smoke did not print ready' }
      - name: Smoke test staged app
        shell: pwsh
        run: |
          $p = Start-Process -PassThru -WindowStyle Hidden build/win/node.exe 'build/win/app/cli.js --port 47899'
          Start-Sleep -Seconds 5
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:47899/api/ping).Content
          Stop-Process -Id $p.Id
      - name: Smoke test tray icon (cli.js --tray-check → PixelOfficeTray.exe, no PowerShell)
        shell: pwsh
        run: |
          build/win/node.exe build/win/app/cli.js --tray-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Without the exe there is no tray (never a PowerShell fallback).
          Rename-Item build/win/PixelOfficeTray.exe PixelOfficeTray.off
          build/win/node.exe build/win/app/cli.js --tray-check
          $rc = $LASTEXITCODE
          Rename-Item build/win/PixelOfficeTray.off PixelOfficeTray.exe
          if ($rc -eq 0) { throw '--tray-check passed without PixelOfficeTray.exe' }
          exit 0  # the expected failure above must not fail the step
      - name: Smoke test start at login (per-user Startup shortcut)
        shell: pwsh
        run: |
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup\Pixel Office.lnk'
          build/win/node.exe build/win/app/cli.js --autostart on
          if (-not (Test-Path $lnk)) { throw 'autostart on: shortcut missing' }
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          "$($s.TargetPath) $($s.Arguments)"
          if ($s.Arguments -notlike '*launch.vbs*') { throw 'autostart on: wrong target' }
          build/win/node.exe build/win/app/cli.js --autostart off
          if (Test-Path $lnk) { throw 'autostart off: shortcut still there' }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" scripts/package/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: PixelOffice-${{ env.VERSION }}-Windows.exe
          path: release/PixelOffice-${{ env.VERSION }}-Windows.exe
          if-no-files-found: error

  macos:
    name: macOS installer (universal)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: scripts/package/macos.sh "$VERSION"
      - name: Universal node (both slices, signature, runs here)
        run: |
          NODE="build/mac/root/Applications/Pixel Office.app/Contents/Resources/node"
          ARCHS=$(lipo -archs "$NODE")
          echo "lipo -archs: $ARCHS"
          [[ " $ARCHS " == *" arm64 "* && " $ARCHS " == *" x86_64 "* ]]
          codesign --verify --verbose=2 "$NODE"
          codesign -dv "$NODE" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)=' || true
          echo "runner arch: $(uname -m) → $("$NODE" -p process.arch)"
          # Intel slice via Rosetta, when the runner has it (informational).
          arch -x86_64 "$NODE" -p process.arch || echo "::notice::x86_64 slice not run (no Rosetta)"
      - name: postinstall home lookup matches $HOME
        run: |
          # Runs the exact HOME_DIR line from the generated postinstall for the runner user.
          USER_NAME=$(id -un)
          eval "$(grep '^HOME_DIR=' build/mac/scripts/postinstall)"
          echo "HOME_DIR=$HOME_DIR HOME=$HOME"
          test -n "$HOME_DIR" && test "$HOME_DIR" = "$HOME"
      - name: Smoke test packaged app
        run: |
          RES="build/mac/root/Applications/Pixel Office.app/Contents/Resources"
          plutil -lint "$RES/com.pixeloffice.agent.plist"
          test -f "$RES/LICENSE.txt"
          "$RES/node" "$RES/app/cli.js" --port 47899 &
          sleep 5
          curl -sf http://127.0.0.1:47899/api/ping
          kill $!
      - name: Tray icon script compiles (JXA)
        run: |
          node -e "const s=require('fs').readFileSync('server/src/lan/tray.ts','utf8');process.stdout.write(s.match(/MAC_TRAY_JXA = String.raw\`([\s\S]*?)\`;/)[1])" > "$RUNNER_TEMP/tray.js"
          osacompile -l JavaScript -o "$RUNNER_TEMP/tray.scpt" "$RUNNER_TEMP/tray.js"
      - name: Smoke test tray icon (NSStatusBar helper, smoke mode)
        run: |
          RES="build/mac/root/Applications/Pixel Office.app/Contents/Resources"
          "$RES/node" "$RES/app/cli.js" --tray-check
      - uses: actions/upload-artifact@v7
        with:
          name: PixelOffice-${{ env.VERSION }}-Mac.pkg
          path: release/PixelOffice-${{ env.VERSION }}-Mac.pkg
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [build, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: PixelOffice-*
          path: release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PRE=()
          [[ "$TAG" == *-* ]] && PRE=(--prerelease)
          # --notes-file + --generate-notes: gh prepends our table to the generated notes.
          {
            echo '## 어떤 파일을 받나요? / Which file do I download?'
            echo
            echo '| 컴퓨터 / Computer | 파일 / File |'
            echo '| --- | --- |'
            echo "| Windows 10/11 | \`PixelOffice-$VERSION-Windows.exe\` |"
            echo "| Mac (Apple 칩 또는 Intel / Apple silicon or Intel) | \`PixelOffice-$VERSION-Mac.pkg\` |"
            echo "| 자동 업데이트용 — 직접 받지 마세요 / used by auto-update, don't download | \`PixelOffice-$VERSION-node-*-app.tgz\`, \`.sha256\` |"
            echo
          } > notes.md
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "Pixel Office $TAG" \
            --notes-file notes.md --generate-notes "${PRE[@]}"
