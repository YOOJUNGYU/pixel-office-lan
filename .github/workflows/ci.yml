# CI workflow for Pixel Office LAN

name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate AsyncAPI spec
        run: npm run asyncapi:validate

      - name: Generated messages drift check
        run: |
          npm run asyncapi:generate
          if ! git diff --exit-code core/src/messages.ts; then
            echo "::error::core/src/messages.ts is out of sync with core/asyncapi.yaml. Run 'npm run asyncapi:generate' locally and commit the result."
            exit 1
          fi

      - name: Type Check
        run: npm run check-types

      # The CLI tests spawn dist/cli.js, so build before the server tests.
      - name: Build
        run: npm run package

      - name: Server Tests
        run: npm run test:server

      - name: Webview Tests
        run: npm run test:webview
