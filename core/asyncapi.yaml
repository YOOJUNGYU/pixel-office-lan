# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Office Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Office server and the browser
    SPA it serves. The server owns assets, office layout and settings and streams
    them to connected clients. Clients send commands to save layout and toggle
    settings. Only a browser on the same PC (loopback) may connect.
  license:
    name: MIT
  contact:
    name: Pixel Office LAN
    url: https://github.com/YOOJUNGYU/pixel-office-lan

servers:
  local:
    host: 127.0.0.1:47801
    protocol: ws
    description: Local Pixel Office server (default port 47801)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on asset
      loading, layout, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        - $ref: '#/components/schemas/LayoutSaved'
        - $ref: '#/components/schemas/LayoutSaveRejected'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        - $ref: '#/components/schemas/CarpetTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/OfficeAccess'
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        # LAN office
        - $ref: '#/components/schemas/OfficeSnapshot'
        - $ref: '#/components/schemas/ProfileLoaded'
        # Updates (loopback browser only)
        - $ref: '#/components/schemas/UpdateAvailable'
        - $ref: '#/components/schemas/UpdateStatus'
        # Start at login (loopback browser only)
        - $ref: '#/components/schemas/AutostartState'
        # Offices (loopback browser only)
        - $ref: '#/components/schemas/OfficesState'
        - $ref: '#/components/schemas/OfficeCreated'
        - $ref: '#/components/schemas/OfficeCode'
        - $ref: '#/components/schemas/OfficeError'
        - $ref: '#/components/schemas/ProfileError'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/SetShowAreas'
        - $ref: '#/components/schemas/SaveProfile'
        - $ref: '#/components/schemas/InstallUpdate'
        - $ref: '#/components/schemas/CheckUpdate'
        - $ref: '#/components/schemas/SetAutostart'
        - $ref: '#/components/schemas/QuitApp'
        - $ref: '#/components/schemas/CreateOffice'
        - $ref: '#/components/schemas/JoinOffice'
        - $ref: '#/components/schemas/LeaveOffice'
        - $ref: '#/components/schemas/SetActiveView'
        - $ref: '#/components/schemas/GetOfficeCode'
        - $ref: '#/components/schemas/SendChat'
        - $ref: '#/components/schemas/DeleteChat'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames, petIds]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string
        petIds:
          type: array
          description: Manifest ids parallel-indexed to `pets` (what a profile's `pet` names).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    CarpetTilesLoaded:
      description: Carpet auto-tile sprite sets (16 marching-squares pieces per variant).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: carpetTilesLoaded
        sets:
          type: array
          description: Array of carpet variants; each variant is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - alwaysShowLabels
        - externalAssetDirectories
        - showAreas
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        alwaysShowLabels:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string
        showAreas:
          type: boolean

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    OfficeAccess:
      description: >-
        Whether this connection may change anything. The server only accepts
        same-host loopback browsers, so readOnly is a safety net: a read-only
        connection's changes are all refused, so the client hides the controls
        that would send one. Sent first on webviewReady; a client that never
        receives it is not read-only.
      type: object
      additionalProperties: false
      required: [type, readOnly]
      properties:
        type:
          const: officeAccess
        readOnly:
          type: boolean
        version:
          type: string
          description: >-
            The server's app version. A page whose bundle is another version
            (it reconnected to an updated server) reloads itself into the new one.

    UpdateAvailable:
      description: >-
        A newer Pixel Office release exists on GitHub. Sent to loopback browsers
        only: on webviewReady when already known, and when a check finds it.
      type: object
      additionalProperties: false
      required: [type, version, notesUrl]
      properties:
        type:
          const: updateAvailable
        version:
          type: string
        notesUrl:
          type: string
          description: Release page on github.com (change notes).

    AutostartState:
      description: >-
        Whether the office starts at login on this PC. Sent to loopback
        browsers only: on webviewReady and after setAutostart. `supported` is
        false outside an installed Windows/macOS layout (dev runs, Linux); the
        setting is then hidden.
      type: object
      additionalProperties: false
      required: [type, enabled, supported]
      properties:
        type:
          const: autostartState
        enabled:
          type: boolean
        supported:
          type: boolean

    OfficesState:
      description: >-
        This PC's team offices (names only, never codes), the office its
        browser shows (`public` or a tag). Loopback browsers only: on webviewReady and after any office
        change.
      type: object
      additionalProperties: false
      required: [type, offices, activeView]
      properties:
        type:
          const: officesState
        offices:
          type: array
          items:
            $ref: '#/components/schemas/OfficeSummary'
        activeView:
          type: string

    OfficeSummary:
      description: A joined team office. `name` is '' when unknown.
      type: object
      additionalProperties: false
      required: [tag, name]
      properties:
        tag:
          type: string
        name:
          type: string

    OfficeCreated:
      description: >-
        Reply to createOffice, to the requesting socket only: the invite code
        to share with team members.
      type: object
      additionalProperties: false
      required: [type, tag, name, code]
      properties:
        type:
          const: officeCreated
        tag:
          type: string
        name:
          type: string
        code:
          type: string

    OfficeCode:
      description: Reply to getOfficeCode, to the requesting socket only.
      type: object
      additionalProperties: false
      required: [type, tag, code]
      properties:
        type:
          const: officeCode
        tag:
          type: string
        code:
          type: string

    OfficeError:
      description: >-
        A createOffice/joinOffice was refused, to the requesting socket only.
        `alreadyJoined` still switches to that office; `full` = office limit
        reached.
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type:
          const: officeError
        reason:
          $ref: '#/components/schemas/OfficeErrorReason'

    OfficeErrorReason:
      type: string
      enum: [invalidCode, alreadyJoined, nameInvalid, full]

    LayoutSaved:
      description: >-
        A saveLayout was written to layout.json, to the requesting socket
        only. The editor leaves edit mode on it.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: layoutSaved

    LayoutSaveRejected:
      description: >-
        A saveLayout was refused (not a v1 grid within 128×128 whose tiles
        match it, or the file could not be written), to the requesting socket
        only. Nothing was written.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: layoutSaveRejected

    ProfileError:
      description: >-
        A saveProfile was refused, to the requesting socket only, just before
        the unchanged profileLoaded. `nicknameTaken` = another live PC this PC
        can see (public office while in it, every joined team office) uses the
        same nickname (trimmed, NFC, case-insensitive, inner whitespace
        collapsed). Keeping one's current nickname is never refused.
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type:
          const: profileError
        reason:
          $ref: '#/components/schemas/ProfileErrorReason'

    ProfileErrorReason:
      type: string
      enum: [nicknameTaken]

    UpdateStatus:
      description: >-
        Progress of installUpdate / result of checkUpdate (loopback browsers
        only). `installing` = the installer was launched.
      type: object
      additionalProperties: false
      required: [type, state]
      properties:
        type:
          const: updateStatus
        state:
          $ref: '#/components/schemas/UpdateState'
        percent:
          type: integer
          description: Download progress 0-100 while downloading.

    OfficeSnapshot:
      description: >-
        Every agent in the LAN office (this PC's and every live peer's), pushed
        about once a second. Peer agents arrive already redacted by their
        sender when its profile hides details.
      type: object
      additionalProperties: false
      required: [type, agents, people, selfPeerId]
      properties:
        type:
          const: officeSnapshot
        agents:
          type: array
          items:
            $ref: '#/components/schemas/OfficeAgentMessage'
        people:
          type: array
          description: >-
            Everyone connected to the same office as `agents` (this PC first,
            then every live peer), including PCs with no agents.
          items:
            $ref: '#/components/schemas/OfficePersonMessage'
        selfPeerId:
          type: string
          description: This server's peer id (marks which agents are local).

    OfficePersonMessage:
      description: >-
        One PC in the office. `account` = its OS login account name (fixed,
        always shown); `nickname` = optional, '' when unset.
      type: object
      additionalProperties: false
      required: [peerId, account, nickname, palette, hueShift, self]
      properties:
        peerId:
          type: string
        account:
          type: string
        nickname:
          type: string
        nickSince:
          type: integer
          minimum: 0
          description: When the nickname was set (ms epoch); see PeerInfoMessage.
        palette:
          type: integer
        hueShift:
          type: integer
        pet:
          $ref: '#/components/schemas/PetId'
        self:
          type: boolean
          description: This server's own PC.
        chat:
          $ref: '#/components/schemas/ChatMessage'

    ChatMessage:
      description: >-
        This person's chat bubble, pinned to a map spot (world tile
        coordinates, clamped to 0..127). Sanitised by the server. One per PC;
        it stays until its sender replaces or deletes it or goes offline.
      type: object
      additionalProperties: false
      required: [id, text, col, row]
      properties:
        id:
          type: string
        text:
          type: string
        col:
          type: number
        row:
          type: number

    ProfileLoaded:
      description: >-
        This PC's profile, sent on webviewReady and after a profile save.
        `canEdit` is true only for a same-host loopback browser; a read-only
        viewer gets `manualPeers: []`. `account` is this PC's OS login account
        name (read at every start, never editable). `firstRun` = the profile
        has never been saved (character and color not chosen yet).
      type: object
      additionalProperties: false
      required: [type, profile, canEdit, account, firstRun]
      properties:
        type:
          const: profileLoaded
        profile:
          $ref: '#/components/schemas/ProfileMessage'
        canEdit:
          type: boolean
        account:
          type: string
        firstRun:
          type: boolean

    ProfileMessage:
      description: The editable profile (everything but the peer id).
      type: object
      additionalProperties: false
      required: [nickname, palette, hueShift, hideDetails, manualPeers]
      properties:
        nickname:
          type: string
          description: 'Optional, 0-20 chars; shown next to the account name.'
        palette:
          type: integer
          minimum: 0
          maximum: 5
        hueShift:
          type: integer
          minimum: 0
          maximum: 360
        pet:
          $ref: '#/components/schemas/PetId'
        hideDetails:
          type: boolean
        manualPeers:
          type: array
          description: Extra peer IPv4 addresses or hostnames to send to.
          items:
            type: string

    OfficeAgentMessage:
      description: One agent view of one PC; `key` is `<peerId>:<id>`.
      type: object
      additionalProperties: false
      required: [key, id, provider, kind, num, room, permission, act, target, reason, peer]
      properties:
        key:
          type: string
        parentKey:
          type: string
          description: '`<peerId>:<parentId>`, children (subagent, shell) only.'
        id:
          type: string
        provider:
          $ref: '#/components/schemas/AgentProvider'
        kind:
          $ref: '#/components/schemas/AgentViewKind'
        num:
          type: integer
          description: '#n for main sessions, 0 for children.'
        parentId:
          type: string
        room:
          $ref: '#/components/schemas/AgentRoom'
        permission:
          type: boolean
          description: Waiting for approval or input.
        act:
          $ref: '#/components/schemas/AgentAct'
        target:
          type: string
          description: 'What the act applies to (file, pattern, command…), <=120 chars, empty if none.'
        reason:
          type: string
        peer:
          $ref: '#/components/schemas/PeerInfoMessage'

    PeerInfoMessage:
      type: object
      additionalProperties: false
      required: [id, account, nickname, palette, hueShift]
      properties:
        id:
          type: string
        account:
          type: string
          description: >-
            OS login account name, always shown. A 0.3.x peer sends none; its
            nickname (or a short peer id) stands in and its nickname is cleared.
        nickname:
          type: string
          description: Optional ('' = none), shown next to the account.
        nickSince:
          type: integer
          minimum: 0
          description: >-
            When the nickname was set (ms epoch). In a clash the earliest keeps
            it (then the smallest peer id); absent = unknown, loses.
        palette:
          type: integer
          description: Human character 0-5; also the fallback when `pet` is unknown to a viewer.
        hueShift:
          type: integer
        pet:
          $ref: '#/components/schemas/PetId'

    PetId:
      type: string
      description: >-
        A bundled pet the PC picked as its character (instead of the `palette`
        human). Optional; a peer that does not know the field shows the human.
      enum: [claudio, gitcat]

    AgentProvider:
      type: string
      enum: [claude, codex]

    AgentViewKind:
      type: string
      enum: [main, subagent, shell]

    AgentAct:
      type: string
      description: What the agent is doing; each viewer renders it in their own language.
      enum: [idle, edit, read, search, find, web, fetch, mcp, run, delegate, ask, image, tool]

    AgentRoom:
      type: string
      enum: [coding, library, server, lounge]

    UpdateState:
      type: string
      enum: [upToDate, downloading, installing, error]

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    SaveLayout:
      description: Save the office layout to ~/.pixel-agents/layout.json.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    AddExternalAssetDirectory:
      description: >-
        Add an external asset directory. In VS Code the host shows a native
        directory picker and omits `path`; the standalone browser has no native
        picker, so it supplies an absolute `path` typed by the user.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory
        path:
          type: string
          description: Absolute directory path (standalone browser only; omitted in VS Code).

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    SetShowAreas:
      description: Toggle the Areas overlay (translucent rendering on top of the office).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowAreas
        enabled:
          type: boolean

    # ── Supporting schemas ─────────────────────────────────────────

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer

    SaveProfile:
      description: Save this PC's profile (loopback browser only; validated server-side).
      type: object
      additionalProperties: false
      required: [type, profile]
      properties:
        type:
          const: saveProfile
        profile:
          $ref: '#/components/schemas/ProfileMessage'

    InstallUpdate:
      description: >-
        Download the available release's installer and run it (loopback browser
        only).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: installUpdate

    CheckUpdate:
      description: Check GitHub Releases now (loopback browser only).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: checkUpdate

    SetAutostart:
      description: >-
        Turn start-at-login on or off for this PC's user (loopback browser
        only). Answered with autostartState.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAutostart
        enabled:
          type: boolean

    QuitApp:
      description: >-
        Quit Pixel Office on this PC (loopback browser only; Settings → 완전
        종료). The server closes every UI socket with 4010 (WS_CLOSE_APP_QUIT)
        and exits; unlike POST /api/quit it never leaves the update reopen
        marker.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: quitApp

    CreateOffice:
      description: >-
        Create a team office (loopback browser only). Answered with
        officeCreated, then officesState.
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          const: createOffice
        name:
          type: string

    JoinOffice:
      description: >-
        Join a team office by invite code (loopback browser only; tolerant of
        case, spaces and dashes). Answered with officesState.
      type: object
      additionalProperties: false
      required: [type, code]
      properties:
        type:
          const: joinOffice
        code:
          type: string
        name:
          type: string

    LeaveOffice:
      description: Leave a team office (loopback browser only). Answered with officesState.
      type: object
      additionalProperties: false
      required: [type, tag]
      properties:
        type:
          const: leaveOffice
        tag:
          type: string

    SetActiveView:
      description: >-
        Show `public` (only while in no team office) or a joined office's tag
        (loopback browser only). Answered with officesState.
      type: object
      additionalProperties: false
      required: [type, view]
      properties:
        type:
          const: setActiveView
        view:
          type: string

    GetOfficeCode:
      description: >-
        Ask for a joined office's invite code again, to copy it (loopback
        browser only). Answered with officeCode.
      type: object
      additionalProperties: false
      required: [type, tag]
      properties:
        type:
          const: getOfficeCode
        tag:
          type: string

    SendChat:
      description: >-
        Pin this PC's chat bubble at a map spot (loopback browser only),
        replacing the previous one: shown above that tile to everyone in the
        active office view while this PC is live there. Text is sanitised and
        capped at 100 code points; one message per 2 s. Kept in profile.json.
      type: object
      additionalProperties: false
      required: [type, text, col, row]
      properties:
        type:
          const: sendChat
        text:
          type: string
        col:
          type: number
        row:
          type: number

    DeleteChat:
      description: >-
        Remove this PC's chat bubble (loopback browser only). Peers see it
        disappear with the next presence.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: deleteChat
